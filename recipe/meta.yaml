{% set version = "4.44.2.rc1" %}

package:
  name: asyn
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/asyn/archive/refs/tags/R4-44-2.tar.gz
    sha256: 47e993aeb300c597fcb0c3df6d3c88b9dd9e9fb90600da84cb2d2dc5b59a31aa
  - path: ../src
  - patches:
    - patch/001-fix-uninitialized-member-variable.p0.patch

build:
  skip: True  # [ppc64]
  number: 1
  run_exports:
    - {{ pin_subpackage('asyn', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - readline
    - libusb      # [not ppc64]
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r asyn

about:
  home: https://github.com/epics-modules/asyn
  license: EPICS Open License
  summary: "EPICS module for driver and device support"
