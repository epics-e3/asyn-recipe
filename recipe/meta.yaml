{% set version = "4.33.0" %}

package:
  name: asyn
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/asyn/archive/R4-33.tar.gz
    sha256: 5df1e102c095cc8343e68f743e180fd1f573ee32a779dd1ea4a7f4124371820e
  - path: ../src


build:
  number: 0
  run_exports:
    - {{ pin_subpackage('asyn', max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - libusb
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r asyn

about:
  home: https://github.com/epics-modules/asyn
  license: EPICS Open License
  summary: "EPICS module for driver and device support"
