{% set version = "4.41.0" %}

package:
  name: asyn
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/asyn/archive/R4-41.tar.gz
    #sha256: f7af1b5caa7c20af8cc88764f64c86b6f0b2edf99e126df591f557bfad44a4da
  - path: ../src


build:
  number: 11
  run_exports:
    - {{ pin_subpackage('asyn', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - readline
    - libusb      # [not ppc64]
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r asyn

about:
  home: https://github.com/epics-modules/asyn
  license: EPICS Open License
  summary: "EPICS module for driver and device support"
