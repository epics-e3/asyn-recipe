{% set version = "4.45.0" %}

package:
  name: asyn
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/asyn/archive/refs/tags/R4-45.tar.gz
    sha256: 1a0c304310709a32c52ba2cfe80976fb0ca9f33c284383eab173329bf5ddf292
  - path: ../src
  - patches:
    - patch/001-fix-uninitialized-member-variable.p0.patch

build:
  skip: True  # [ppc64]
  number: 0
  run_exports:
    - {{ pin_subpackage('asyn', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - readline
    - libusb      # [not ppc64]
    - epics-base
    - require
    - libtirpc
  run:
    - libtirpc

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r asyn

about:
  home: https://github.com/epics-modules/asyn
  license: EPICS Open License
  summary: "EPICS module for driver and device support"
