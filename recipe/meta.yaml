{% set version = "4.36.0" %}

package:
  name: asyn
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/asyn/archive/R4-36.tar.gz
    sha256: a32fd7f147491341a55086c50fac4c28995381ca3a6653bc65b2eb85b91a855b
  - path: ../src


build:
  number: 0
  run_exports:
    - {{ pin_subpackage('asyn', max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - libusb
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r asyn

about:
  home: https://github.com/epics-modules/asyn
  license: EPICS Open License
  summary: "EPICS module for driver and device support"
