{% set version = "4.37.0" %}

package:
  name: asyn
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/asyn/archive/R4-37.tar.gz
    sha256: 8c281beee8dc559c08a115f58159814e63ffb02aa6be668b7ec31ebda9e9545a
  - path: ../src


build:
  number: 0
  run_exports:
    - {{ pin_subpackage('asyn', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - libusb      # [not ppc64]
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r asyn

about:
  home: https://github.com/epics-modules/asyn
  license: EPICS Open License
  summary: "EPICS module for driver and device support"
