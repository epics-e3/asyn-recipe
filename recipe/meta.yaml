{% set version = "4.43.0" %}

package:
  name: asyn
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/asyn/archive/R4-43.tar.gz
    sha256: 2cd1da9bafc6e09d18992d00797ea4b966d7404be2fb0d309bc3f542e6b3c7ba
  - path: ../src


build:
  number: 0
  run_exports:
    - {{ pin_subpackage('asyn', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - readline
    - libusb      # [not ppc64]
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r asyn

about:
  home: https://github.com/epics-modules/asyn
  license: EPICS Open License
  summary: "EPICS module for driver and device support"
