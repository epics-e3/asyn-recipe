{% set version = "4.34.0" %}

package:
  name: asyn
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/asyn/archive/R4-34.tar.gz
    sha256: 17261d623009db09c9ffcfc7c87b5f6e5bdd3ded326204c54c9e789db8f91f24
  - path: ../src


build:
  number: 0
  run_exports:
    - {{ pin_subpackage('asyn', max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - libusb
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - run-iocsh -r asyn

about:
  home: https://github.com/epics-modules/asyn
  license: EPICS Open License
  summary: "EPICS module for driver and device support"
